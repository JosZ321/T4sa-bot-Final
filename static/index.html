<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PhoneFilm App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0a0a0a;
    color: #fff;
    height: 100%;
    overflow: hidden;
  }
  
  /* Iframe - exactly like original, no pointer-events changes */
  #site-frame {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    border: none;
    z-index: 1;
    filter: brightness(0.85) saturate(1.1);
    transition: filter 0.6s ease;
  }
  
  #site-frame.unlocked {
    filter: brightness(1) saturate(1);
  }
  
  /* Click blocker - transparent overlay that catches clicks but allows scroll to pass through */
  #click-blocker {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    background: transparent;
    /* This blocks clicks on the iframe below */
    pointer-events: auto;
  }
  
  #click-blocker.hidden {
    display: none;
  }
  
  /* Popup overlay - above everything */
  #overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.15);
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    padding-top: max(20px, env(safe-area-inset-top));
    padding-bottom: max(20px, env(safe-area-inset-bottom));
    transition: opacity 0.6s ease, visibility 0.6s ease;
  }
  
  #overlay.hidden { 
    opacity: 0; 
    visibility: hidden; 
    pointer-events: none; 
  }
  
  /* ----- UPDATED POPUP STYLES START ----- */
  .popup-box {
    background: rgba(255, 255, 255, 0.06);
    border-radius: 18px;
    padding: 18px 16px;
    max-width: 285px;
    width: 92%;
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
    text-align: center;
    animation: fadeScale 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    backdrop-filter: blur(20px) saturate(1.5);
    -webkit-backdrop-filter: blur(20px) saturate(1.5);
  }
  .popup-box .icon {
    font-size: 30px;
    margin-bottom: 6px;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
  }
  .popup-box h2 {
    font-size: 16px;
    margin-bottom: 5px;
    font-weight: 700;
    letter-spacing: -0.3px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
  }
  .popup-box p {
    color: rgba(255,255,255,.75);
    margin-bottom: 14px;
    font-size: 11.5px;
    line-height: 1.45;
    text-shadow: 0 1px 2px rgba(0,0,0,.2);
  }
  .channel-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 11px;
    margin-bottom: 8px;
    background: #E50914;
    color: #fff;
    text-decoration: none;
    border-radius: 12px;
    font-weight: 600;
    font-size: 13px;
    border: 1px solid rgba(255,255,255,.1);
    cursor: pointer;
    transition: all .25s ease;
    backdrop-filter: blur(4px);
  }
  .channel-btn:active {
    transform: translateY(-1px);
    background: #FF1F2D;
    box-shadow: 0 4px 16px rgba(229,9,20,.35);
  }
  .channel-btn.secondary {
    background: #229ED9;
    border: 1px solid rgba(255,255,255,.1);
  }
  .channel-btn.secondary:active {
    background: #37B4F2;
    box-shadow: 0 4px 16px rgba(34,158,217,.35);
  }
  .check-btn {
    width: 100%;
    padding: 12px;
    background: #28A745;
    color: #fff;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 12px;
    font-weight: 700;
    font-size: 13.5px;
    margin-top: 4px;
    cursor: pointer;
    transition: all .25s ease;
    backdrop-filter: blur(4px);
  }
  .check-btn:active {
    background: #34C759;
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(40,167,69,.35);
  }
  .check-btn:disabled {
    background: rgba(80,80,80,.6);
    transform: none;
    box-shadow: none;
    cursor: not-allowed;
  }
  /* ----- UPDATED POPUP STYLES END ----- */
  
  @keyframes fadeScale {
    from { transform: scale(0.9) translateY(20px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }
  
  #status { margin-top: 10px; color: #ff8585; font-size: 12px; min-height: 18px; text-shadow: 0 1px 2px rgba(0,0,0,0.3); cursor: pointer; }
  
  #loader {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: #0a0a0a; z-index: 200;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px; transition: opacity 0.5s ease;
  }
  
  #loader.hidden { opacity: 0; pointer-events: none; }
  
  .spinner { width: 42px; height: 42px; border: 3px solid rgba(255, 255, 255, 0.1); border-top-color: #e50914; border-radius: 50%; animation: spin 0.9s linear infinite; }
  
  @keyframes spin { to { transform: rotate(360deg); } }
  
  .loader-text { color: rgba(255, 255, 255, 0.6); font-size: 14px; letter-spacing: 0.5px; }
  
  .unlocked-glow { animation: glowPulse 1s ease; }
  
  @keyframes glowPulse { 
    0% { filter: brightness(0.85); } 
    50% { filter: brightness(1.2); } 
    100% { filter: brightness(1); } 
  }
</style>
</head>
<body>

  <!-- Iframe exactly like original - no changes -->
  <iframe id="site-frame" src="https://www.t4tsa.cc/" allow="fullscreen"></iframe>
  
  <!-- Click blocker sits between iframe and popup -->
  <div id="click-blocker"></div>

  <!-- Popup overlay -->
  <div id="overlay">
    <div class="popup-box">
      <div class="icon">🔓</div>
      <h2>Unlock Full Access</h2>
      <p>Join the channels below to unlock all features and start streaming.</p>
      <a href="https://t.me/SeriesBayX0" target="_blank" class="channel-btn">📢 Join Series Index | T4TSA</a>
      <a href="https://t.me/MugiwaraResearcher" target="_blank" class="channel-btn secondary">📢 Join Mugiwara Researcher | Crypto❕</a>
      <button class="check-btn" id="checkBtn" onclick="verifyMembership()">✅ I've Joined, Unlock</button>
      <p id="status" onclick="verifyMembership()"></p>
    </div>
  </div>

  <div id="loader">
    <div class="spinner"></div>
    <p class="loader-text">Loading PhoneFilm...</p>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    const BOT_API_URL = '/api/check';
    let userId = null;

    async function init() {
      if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
        userId = tg.initDataUnsafe.user.id;
        await verifyMembership();
      } else {
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('status').textContent = 'Open this inside Telegram';
      }
    }

    async function verifyMembership() {
      const btn = document.getElementById('checkBtn');
      const status = document.getElementById('status');
      const loader = document.getElementById('loader');
      const overlay = document.getElementById('overlay');
      const clickBlocker = document.getElementById('click-blocker');

      btn.disabled = true;
      btn.textContent = 'Checking...';
      status.textContent = '';

      try {
        const response = await fetch(`${BOT_API_URL}?user_id=${userId}`);
        const data = await response.json();

        loader.classList.add('hidden');

        if (data.joined === true) {
          overlay.classList.add('hidden');
          clickBlocker.classList.add('hidden');
        } else {
          status.textContent = 'Please make sure you\'ve joined "Mugiwara Researcher | Crypto❕" and "Series Index | T4TSA", then tap Retry.';
        }
      } catch (err) {
        loader.classList.add('hidden');
        status.textContent = 'Connection error — tap to retry.';
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = "✅ I've Joined, Unlock";
      }
    }

    init();
  </script>
</body>
</html>
